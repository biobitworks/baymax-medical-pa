<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baymax · Before and after</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #faf8f3; color: #243e36; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 1500px; margin: auto; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); letter-spacing: -1px; }
    p { color: #53675d; }
    .controls { display: flex; flex-wrap: wrap; gap: 20px; margin: 28px 0; }
    label { display: grid; gap: 6px; font-weight: 600; }
    select { font: inherit; padding: 10px 16px; border: 1px solid #ccd6c7; background: white; color: inherit; border-radius: 12px; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    figure { margin: 0; }
    figcaption { padding: 12px 0; font-size: 18px; font-weight: 700; }
    img { display: block; width: 100%; border: 1px solid #dde3d9; border-radius: 16px; background: white; }
    .mobile img { max-width: 390px; margin: auto; }
    .mobile figcaption { text-align: center; }
    a { color: #2d5c49; }
    @media(max-width: 700px) { body { padding: 20px; } .comparison { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>A little more Baymax.</h1>
    <p>Larger type, clearer navigation, and a warmer welcome. Screenshots use mocked sample data; backend requests were intercepted for this review.</p>
    <div class="controls">
      <label>Screen <select id="screen"><option value="chat">Talk to Baymax</option><option value="today">Today</option><option value="fitness">Physical fitness</option></select></label>
      <label>Size <select id="size"><option value="desktop">Desktop · 1440px</option><option value="mobile">Mobile · 390px</option></select></label>
    </div>
    <div class="comparison" id="comparison">
      <figure><figcaption>Before</figcaption><a id="before-link"><img id="before" alt="Baymax before the UI refresh"></a></figure>
      <figure><figcaption>After</figcaption><a id="after-link"><img id="after" alt="Baymax after the UI refresh"></a></figure>
    </div>
    <p>Click a screenshot to see it at full size. <a href="http://localhost:5173">Open the running app →</a></p>
  </main>
  <script>
    const screen = document.getElementById('screen');
    const size = document.getElementById('size');
    function update() {
      const index = { chat: 1, today: 2, fitness: 3 }[screen.value] + (size.value === 'mobile' ? 3 : 0);
      const name = `${String(index).padStart(2, '0')}-${screen.value}-${size.value}.png`;
      document.getElementById('comparison').classList.toggle('mobile', size.value === 'mobile');
      for (const version of ['before', 'after']) {
        const path = `${version}/${name}`;
        document.getElementById(version).src = path;
        document.getElementById(`${version}-link`).href = path;
        document.getElementById(version).alt = `${screen.selectedOptions[0].textContent}, ${size.value}, ${version} the UI refresh`;
      }
    }
    screen.addEventListener('change', update);
    size.addEventListener('change', update);
    update();
  </script>
</body>
</html>
