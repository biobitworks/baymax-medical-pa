# Change this to an available Fly app name before deploying.
app = 'baymax-medical-pa'
primary_region = 'sjc'
[build]
  dockerfile = 'Dockerfile'
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
[[vm]]
  memory = '256mb'
  cpus = 1
  cpu_kind = 'shared'
