<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Baymax · Mobile notification demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5ee;color:#263c32;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 12px;gap:18px}.eyebrow{font-size:11px;font-weight:650;letter-spacing:2px;text-transform:uppercase;color:#6b8165}.intro{text-align:center}h1{font-size:26px;font-weight:600;letter-spacing:-1px;margin:7px 0 0}.phone{width:390px;max-width:100%;height:800px;position:relative;overflow:hidden;border:7px solid #26312b;border-radius:48px;background:radial-gradient(ellipse at 18% 20%,#e8eee0,transparent 60%),radial-gradient(ellipse at 80% 66%,#bfd2ac,transparent 55%),#dce5d2;box-shadow:0 28px 60px #304b3420}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);height:26px;width:103px;border-radius:20px;background:#26312b;z-index:3}.status{height:52px;padding:16px 23px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;position:relative;z-index:2}.status-icons{display:flex;align-items:center;gap:5px}.signal{font-size:13px;letter-spacing:-3px}.battery{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;display:inline-block;position:relative}.battery:after{content:"";position:absolute;inset:2px;background:currentColor;border-radius:1px}.clock{text-align:center;padding:12px 0 16px}.lock-symbol{font-size:16px}.date{font-size:14px;font-weight:500;margin-top:8px}.time{font-size:64px;font-weight:350;letter-spacing:-4px;line-height:1.1}.companion{display:block;width:44px;height:44px;margin:8px auto 0;border-radius:18px}.notification-list{padding:0 13px;display:flex;flex-direction:column;gap:10px}.notification{background:#f9fbf5df;border:1px solid #ffffffb0;border-radius:24px;box-shadow:0 6px 16px #3a52300a;padding:12px 14px;animation:arrive .5s cubic-bezier(.18,.7,.2,1) both}.notification-head{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;color:#62715f;margin-bottom:6px}.notification-head img{width:20px;height:20px;border-radius:7px}.notification-head time{margin-left:auto;font-weight:400}.notification h2{font-size:14px;line-height:1.3;margin:0 0 5px;letter-spacing:-.2px}.notification p{font-size:12px;line-height:1.4;margin:0;color:#4f6152}.actions{display:flex;gap:8px;margin-top:10px}button{cursor:pointer;font:inherit;border:0;color:inherit}button:focus-visible{outline:3px solid #79996c;outline-offset:3px}.notification button{font-size:12px;padding:7px 12px;background:#e6eddf;border-radius:15px;font-weight:600}.notification button:first-child{background:#314e3c;color:#fff}.lock-footer{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#4a6144;font-size:10px;letter-spacing:.2px}.home-bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);height:4px;width:110px;border-radius:8px;background:#263c32}.app-screen{position:absolute;inset:52px 0 0;background:#f7f8f5;padding:20px;animation:open .35s ease both}.app-head{display:flex;align-items:center;gap:10px;font-weight:650;font-size:18px;letter-spacing:-.5px}.app-head img{width:35px;border-radius:12px}.app-head small{display:block;font-size:10px;font-weight:400;letter-spacing:0;color:#74816e;margin-top:2px}.back{margin-left:auto;border-radius:20px;padding:8px 12px;background:#e9eee3;font-size:11px;font-weight:500}.app-mascot{display:block;width:88px;border-radius:28px;margin:46px auto 24px}.app-title{text-align:center;font-size:25px;font-weight:600;letter-spacing:-1px;line-height:1.2;margin:0 0 9px}.app-note{text-align:center;color:#74816e;font-size:13px;line-height:1.5;margin:0 8px 25px}.care-card{padding:22px;border:1px solid #dfe5d7;border-radius:25px;background:#fff;box-shadow:0 10px 30px #263c3205}.tag{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#7a8d70}.care-card h3{margin:14px 0 8px;font-size:19px;font-weight:600;line-height:1.3;letter-spacing:-.5px}.care-card p{font-size:13px;color:#687b63;line-height:1.55;margin:0 0 18px}.detail-row{display:flex;justify-content:space-between;font-size:12px;border-top:1px solid #edf0e8;padding:13px 0;gap:15px}.detail-row span:last-child{font-weight:600;text-align:right}.primary{width:100%;padding:14px 12px;border-radius:22px;background:#314e3c;color:#fff;font-size:13px;font-weight:600;margin-top:12px}.secondary{display:block;margin:14px auto 0;background:none;color:#798a73;font-size:11px}.success{padding:23px 18px;text-align:center;border-radius:22px;background:#e9f0e1;margin-top:15px;animation:arrive .4s ease both}.success b{display:block;font-size:15px;font-weight:600;margin-bottom:5px}.success p{font-size:12px;line-height:1.5;margin:0;color:#62765a}.app-bottom{position:absolute;bottom:45px;left:20px;right:20px;border:1px solid #e1e6da;border-radius:25px;padding:15px;text-align:center;font-size:11px;color:#7b8d71}.caption{text-align:center;max-width:390px;color:#6e8066;font-size:11px;line-height:1.6}.replay{background:none;text-decoration:underline;font-size:11px;padding:4px 12px;color:#56704e}.hidden{display:none}@keyframes arrive{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes open{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@media(max-width:420px){.stage{padding:18px 8px}.phone{width:360px;height:780px}.time{font-size:60px}.clock{padding-top:10px;padding-bottom:14px}.notification{padding:12px 14px}.app-mascot{margin-top:30px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.notification{border:2px solid #dce8cc;box-shadow:0 4px 0 #a9bf9350;background:#fcfff7}.notification h2{font-weight:750;font-size:15px}.notification button:first-child,.primary{background:#78b832;color:#183409;box-shadow:0 4px 0 #518820;font-weight:750;transition:transform .15s,box-shadow .15s}.notification button:first-child:active,.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #518820}.success{border:2px solid #b5d994;background:#effbdc}.success b{color:#3b7016}.app-bottom{background:#eff5e7}.companion{animation:baymax-bounce 2.4s ease-in-out infinite}@keyframes baymax-bounce{0%,80%,100%{transform:translateY(0) rotate(0)}88%{transform:translateY(-5px) rotate(-5deg)}94%{transform:translateY(-2px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){.companion{animation:none}.notification button:first-child,.primary{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <div class="intro"><div class="eyebrow">Baymax · Reminder demo</div><h1>Small steps. Big Baymax energy.</h1></div>
  <section class="phone" aria-label="Simulated mobile phone">
    <div class="island"></div>
    <div class="status"><span>9:41</span><span class="status-icons"><span class="signal">▂▄▆█</span><span>◔</span><span class="battery"></span></span></div>
    <section id="lock-screen" aria-label="Notification preview">
      <div class="clock"><div class="lock-symbol">⌑</div><div class="date">Sunday, October 4</div><div class="time">9:41</div><img class="companion" src="/icons/icon-192.png" alt="Baymax" /></div>
      <div id="notification-list" class="notification-list" aria-live="polite"></div>
      <div class="lock-footer">Your next small win is waiting. You choose when.</div>
    </section>
    <section id="app-screen" class="app-screen hidden" aria-label="Baymax care preview"></section>
    <div class="home-bar"></div>
  </section>
  <div class="caption"><button class="replay" id="replay">Replay notifications</button></div>
</main>
<script>
const icon='/icons/icon-192.png';
const reminders={
  meds:{title:'Your routine called. You’ve got this. 💊',body:'Time for your scheduled medication. Take it as prescribed, then collect a little win.',action:'Let’s do this',tag:'Medication reminder',heading:'One small step for your health.',note:'Your care routine, with a little encouragement.',card:'Your scheduled medication',description:'Follow the instructions on your prescription. Mark it as taken when you’re done.',detail:['Reminder','Today · 9:41 AM'],cta:'Mark as taken',success:'Medication checked off.',after:'Tiny victory unlocked. Give yourself a little credit. I’ll be here for the next step.'},
  refill:{title:'Future you says: nice refill planning. ✨',body:'Your refill reminder is due. Review your prescription with your pharmacy before you run low.',action:'Review refill',tag:'Refill reminder',heading:'Let’s keep your care on track.',note:'A little planning today. One less worry tomorrow.',card:'Buy your next refill',description:'Review your existing prescription and check availability with your usual pharmacy.',detail:['Next step','Review with your pharmacy'],cta:'Prepare refill request',success:'Your refill request is ready.',after:'Review it with your pharmacy before buying. Prescription verification may be required.'},
  exercise:{title:'Ten minutes. One small win. 🚶',body:'A comfy pace. A little fresh air. Baymax is cheering for your next step.',action:'I’m in',tag:'Movement reminder',heading:'Make a little room for you.',note:'A gentle walk. A clearer head.',card:'A 10-minute walk',description:'Choose a comfortable pace and a route you enjoy. A small step counts.',detail:['Today’s goal','10 minutes of movement'],cta:'Start my walk',success:'Your walk has started.',after:'First step unlocked! Enjoy the fresh air at your own pace. Baymax is cheering you on.'}
};
const list=document.querySelector('#notification-list');
const app=document.querySelector('#app-screen');
const lock=document.querySelector('#lock-screen');
let timers=[];
function showNotification(kind){
 if(document.querySelector('[data-reminder="'+kind+'"]'))return;
 const r=reminders[kind]; const card=document.createElement('article');card.className='notification';card.dataset.reminder=kind;
 card.innerHTML=`<div class="notification-head"><img src="${icon}" alt="" /> BAYMAX <time>now</time></div><h2>${r.title}</h2><p>${r.body}</p><div class="actions"><button data-open="${kind}">${r.action}</button><button data-snooze="${kind}">Later</button></div>`;
 list.append(card);
}
function openReminder(kind){
 const r=reminders[kind];lock.classList.add('hidden');app.classList.remove('hidden');
 app.innerHTML=`<div class="app-head"><img src="${icon}" alt=""/><div>Baymax<small>Here when you need me</small></div><button class="back" id="back">Reminders</button></div><img class="app-mascot" src="${icon}" alt="Baymax"/><h2 class="app-title">${r.heading}</h2><p class="app-note">${r.note}</p><section class="care-card"><div class="tag">${r.tag}</div><h3>${r.card}</h3><p>${r.description}</p><div class="detail-row"><span>${r.detail[0]}</span><span>${r.detail[1]}</span></div><button class="primary" id="complete">${r.cta}</button><button class="secondary" id="later">A little later</button><div id="result" aria-live="polite"></div></section><div class="app-bottom">Small steps count. So does taking a break.</div>`;
 document.querySelector('#complete').onclick=()=>{
  const result=document.querySelector('#result');result.className='success';result.innerHTML=`<b>✓ ${r.success}</b><p>${r.after}</p>`;
  document.querySelector('#complete').classList.add('hidden');document.querySelector('#later').classList.add('hidden');
 };
 document.querySelector('#back').onclick=back;
 document.querySelector('#later').onclick=back;
}
function back(){app.classList.add('hidden');lock.classList.remove('hidden')}
function reset(){timers.forEach(clearTimeout);timers=[];back();list.innerHTML=''}
function play(){reset();['meds','refill','exercise'].forEach((kind,i)=>timers.push(setTimeout(()=>showNotification(kind),900+i*2600)))}
list.onclick=e=>{const open=e.target.closest('[data-open]');const snooze=e.target.closest('[data-snooze]');if(open)openReminder(open.dataset.open);if(snooze)snooze.closest('article').remove()};
document.querySelector('#replay').onclick=play;
window.baymaxNotificationDemo={showNotification,openReminder,back,reset,play};
if(!new URLSearchParams(location.search).has('record'))play();
</script>
</body>
</html>
