<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8f5" />
  <title>Baymax · Reconnect</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f7f8f5; color: #263c32; font-family: system-ui, sans-serif; padding: 28px; }
    main { max-width: 390px; text-align: center; }
    img { width: 104px; border-radius: 28px; }
    h1 { font-size: 28px; line-height: 1.2; }
    p { line-height: 1.6; color: #62715f; }
    button { border: 0; border-radius: 24px; padding: 14px 28px; background: #263c32; color: white; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #729a73; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Baymax" />
    <h1>A little care, when you reconnect.</h1>
    <p>You’re offline. Connect to the internet to open Baymax and continue chatting.</p>
    <button onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
